<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Products</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="sidebar">
      <h2>MobiStore</h2>
      <a href="admin.html">📊 Dashboard</a>
      <a href="products.html">📦 Sản phẩm</a>
      <a href="orders.html">🛒 Đơn hàng</a>
      <a href="users.html">👤 Người dùng</a>
      <a class="active" href="upload.html">⬆️ Upload dữ liệu</a>
    </div>

    <div class="main">
      <h2 id="statusTitle">Đang upload dữ liệu lên Firebase...</h2>
      <p id="statusDetail"></p>

      <script src="../User/js/data.js"></script>

      <script>
        const statusTitle = document.getElementById("statusTitle");
        const statusDetail = document.getElementById("statusDetail");

        const seedProducts = window.seedProducts || [];

        function makeProductDocId(product) {
          const base = `${product.brand || ""}-${product.name || ""}`
            .trim()
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "");

          return `seed-${product.id || base || Date.now()}`;
        }

        async function uploadData() {
          const authState = localStorage.getItem("mobistore_auth");
          if (!authState) {
            statusTitle.textContent = "Bạn cần đăng nhập admin trước rồi mở trang này để upload.";
            statusDetail.textContent = "Mở login admin, đăng nhập, sau đó quay lại trang upload.";
            return;
          }

          statusTitle.textContent = "Đang upload dữ liệu lên API...";
          statusDetail.textContent = `Tài khoản admin đã xác thực.`;

          let created = 0;
          let skipped = 0;

          for (const product of seedProducts) {
            const docId = makeProductDocId(product);
            try {
              const response = await fetch("http://localhost:3001/api/products", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ ...product, id: docId }),
              });

              if (response.ok) {
                created += 1;
              } else {
                skipped += 1;
              }
            } catch (error) {
              skipped += 1;
              console.warn("Upload product skipped:", error.message);
            }
          }

          statusTitle.textContent = "Upload hoàn tất";
          statusDetail.textContent = `Đã thêm ${created} sản phẩm, bỏ qua ${skipped} sản phẩm.`;
        }

        uploadData();
      </script>
    </div>
  </body>
</html>
